<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hasil Ujian</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #F0F9FF 0%, #DBEAFE 100%);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .result-wrap {
      width: 100%; max-width: 560px;
    }
    .result-card {
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 12px 48px rgba(0,0,0,0.12);
      overflow: hidden;
      animation: slideUp 0.4s ease;
    }
    .result-top {
      padding: 40px 36px 30px;
      text-align: center;
      position: relative;
    }
    .result-top.lulus   { background: linear-gradient(135deg, #16A34A, #15803D); }
    .result-top.tidak   { background: linear-gradient(135deg, #DC2626, #B91C1C); }
    .result-emoji  { font-size: 4rem; margin-bottom: 10px; display: block; }
    .result-status { color: rgba(255,255,255,0.9); font-size: 0.95rem; margin-bottom: 8px; }
    .result-nilai  {
      font-size: 6rem; font-weight: 800; color: #fff;
      font-family: 'Poppins', sans-serif; line-height: 1;
      margin: 8px 0;
    }
    .result-label  { color: rgba(255,255,255,0.85); font-size: 1.1rem; font-weight: 600; }

    .result-body { padding: 28px 36px; }
    .result-info-grid {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 16px; margin-bottom: 24px;
    }
    .ri-box {
      text-align: center; padding: 14px;
      background: #F8FAFC; border-radius: 12px;
      border: 1px solid var(--border);
    }
    .ri-box .ri-val { font-size: 1.8rem; font-weight: 700; }
    .ri-box .ri-lbl { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }

    .siswa-info { margin-bottom: 24px; }
    .siswa-info-row {
      display: flex; justify-content: space-between;
      padding: 10px 0; border-bottom: 1px solid #F1F5F9;
      font-size: 0.9rem;
    }
    .siswa-info-row:last-child { border-bottom: none; }
    .siswa-info-row .label { color: var(--text-muted); }
    .siswa-info-row .value { font-weight: 600; }

    .result-footer { padding: 0 36px 28px; display: flex; gap: 12px; }
    @keyframes slideUp { from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1} }
    @media(max-width:480px){
      .result-top, .result-body, .result-footer { padding-left:20px; padding-right:20px; }
      .result-info-grid { grid-template-columns:1fr 1fr; }
      .result-nilai { font-size:5rem; }
    }
  </style>
</head>
<body>
  <div class="result-wrap">
    <div class="result-card">
      <!-- TOP / SCORE DISPLAY -->
      <div class="result-top" id="result-top">
        <span class="result-emoji" id="result-emoji">🏆</span>
        <div class="result-status" id="result-status">Ujian Selesai</div>
        <div class="result-nilai" id="result-nilai">-</div>
        <div class="result-label" id="result-label">-</div>
      </div>

      <!-- BODY -->
      <div class="result-body">
        <!-- Statistik jawaban -->
        <div class="result-info-grid">
          <div class="ri-box">
            <div class="ri-val" id="ri-benar" style="color:var(--success)">-</div>
            <div class="ri-lbl">✅ Benar</div>
          </div>
          <div class="ri-box">
            <div class="ri-val" id="ri-salah" style="color:var(--danger)">-</div>
            <div class="ri-lbl">❌ Salah</div>
          </div>
          <div class="ri-box">
            <div class="ri-val" id="ri-kosong" style="color:var(--warning)">-</div>
            <div class="ri-lbl">⬜ Kosong</div>
          </div>
        </div>

        <!-- Data siswa -->
        <div class="siswa-info">
          <div class="siswa-info-row">
            <span class="label"><i class="fas fa-user"></i> Nama</span>
            <span class="value" id="res-nama">-</span>
          </div>
          <div class="siswa-info-row">
            <span class="label"><i class="fas fa-id-card"></i> NIS</span>
            <span class="value" id="res-nis">-</span>
          </div>
          <div class="siswa-info-row">
            <span class="label"><i class="fas fa-school"></i> Kelas</span>
            <span class="value" id="res-kelas">-</span>
          </div>
          <div class="siswa-info-row">
            <span class="label"><i class="fas fa-book"></i> Mata Pelajaran</span>
            <span class="value" id="res-mapel">-</span>
          </div>
          <div class="siswa-info-row">
            <span class="label"><i class="fas fa-clock"></i> Selesai</span>
            <span class="value" id="res-waktu">-</span>
          </div>
        </div>

        <!-- Pesan motivasi -->
        <div id="pesan-motivasi" class="alert alert-info" style="text-align:center;">
          <span></span>
        </div>
      </div>

      <!-- FOOTER ACTIONS -->
      <div class="result-footer">
        <button class="btn btn-secondary flex-1" onclick="window.print()">
          <i class="fas fa-print"></i> Cetak
        </button>
        <button class="btn btn-primary flex-1" onclick="kembaliKeHome()">
          <i class="fas fa-home"></i> Kembali ke Beranda
        </button>
      </div>
    </div>

    <!-- Konfirmasi sudah dilihat -->
    <p style="text-align:center;color:rgba(0,0,0,0.5);font-size:0.8rem;margin-top:16px;">
      <i class="fas fa-info-circle"></i>
      Simpan screenshot atau cetak halaman ini sebagai bukti ujian Anda.
    </p>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/utils.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const hasil = Utils.getLocal('ujian_hasil');

      if (!hasil) {
        document.body.innerHTML = `
          <div style="text-align:center;padding:60px;font-family:Inter,sans-serif;">
            <div style="font-size:4rem;margin-bottom:16px;">😕</div>
            <h2>Data Hasil Tidak Ditemukan</h2>
            <p style="color:#64748B;margin:12px 0 24px;">Silakan kembali ke halaman beranda.</p>
            <a href="index.html" style="background:#2563EB;color:#fff;padding:12px 24px;border-radius:10px;text-decoration:none;font-weight:600;">
              Kembali ke Beranda
            </a>
          </div>`;
        return;
      }

      const nilai     = hasil.nilai || 0;
      const lulus     = nilai >= 75;
      const totalSoal = hasil.totalSoal || 0;
      const benar     = hasil.totalBenar || 0;
      const salah     = hasil.totalSalah || 0;
      const kosong    = totalSoal - benar - salah;

      // Top area
      const topEl = document.getElementById('result-top');
      topEl.classList.add(lulus ? 'lulus' : 'tidak');
      document.getElementById('result-emoji').textContent  = lulus ? '🎉' : '💪';
      document.getElementById('result-status').textContent = lulus ? 'Selamat, Anda LULUS!' : 'Tetap Semangat!';
      document.getElementById('result-nilai').textContent  = nilai;
      document.getElementById('result-label').textContent  = Utils.nilaiLabel(nilai);

      // Statistik
      document.getElementById('ri-benar').textContent  = benar;
      document.getElementById('ri-salah').textContent  = salah;
      document.getElementById('ri-kosong').textContent = Math.max(0, kosong);

      // Data siswa
      document.getElementById('res-nama').textContent  = hasil.nama   || '-';
      document.getElementById('res-nis').textContent   = hasil.nis    || '-';
      document.getElementById('res-kelas').textContent = hasil.kelas  || '-';
      document.getElementById('res-mapel').textContent = hasil.namaMapel || hasil.kodeMapel || '-';
      document.getElementById('res-waktu').textContent = new Date().toLocaleString('id-ID');

      // Pesan motivasi
      const pesanEl  = document.getElementById('pesan-motivasi');
      const pesanSpan = pesanEl.querySelector('span');
      pesanSpan.textContent = hasil.pesan || (lulus ? '🎉 Hasil yang luar biasa!' : '💪 Jangan menyerah!');
      pesanEl.className = `alert ${lulus ? 'alert-success' : 'alert-warning'}`;

      // Hapus data hasil dari localStorage
      Utils.removeLocal('ujian_hasil');
    });

    function kembaliKeHome() {
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
