<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hasil Ujian - Admin</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <style>
    .admin-wrap{display:flex;min-height:100vh;}
    .sidebar{width:260px;background:#1E293B;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
    .sidebar-logo{padding:24px 20px;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;gap:12px;color:#fff;font-family:'Poppins',sans-serif;font-weight:700;font-size:1rem;}
    .sidebar-logo .logo-icon{font-size:1.6rem;}
    .nav-section{padding:16px 20px 6px;font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:rgba(255,255,255,0.35);}
    .nav-item{display:flex;align-items:center;gap:12px;padding:11px 20px;color:rgba(255,255,255,0.65);font-size:0.88rem;cursor:pointer;transition:all 0.18s;border-left:3px solid transparent;text-decoration:none;}
    .nav-item:hover{background:rgba(255,255,255,0.06);color:#fff;text-decoration:none;}
    .nav-item.active{background:rgba(37,99,235,0.2);color:#fff;border-left-color:#2563EB;}
    .nav-item .ni{width:20px;text-align:center;font-size:0.95rem;}
    .sidebar-bottom{margin-top:auto;padding:16px 20px;border-top:1px solid rgba(255,255,255,0.08);}
    .main-content{flex:1;padding:28px;background:#F8FAFC;overflow:auto;}
    .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px;}
    .nilai-bar{height:10px;border-radius:99px;background:linear-gradient(90deg,var(--danger),var(--warning),var(--success));position:relative;}
    .nilai-bar-marker{position:absolute;top:-4px;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--primary);transform:translateX(-50%);}
  </style>
</head>
<body>
<div class="admin-wrap">
  <aside class="sidebar">
    <div class="sidebar-logo"><span class="logo-icon">🎓</span><div>Ujian Online<div style="font-size:0.7rem;opacity:0.5;font-weight:400">Admin Panel</div></div></div>
    <div class="nav-section">Menu Utama</div>
    <a href="dashboard.html" class="nav-item"><span class="ni"><i class="fas fa-home"></i></span> Dashboard</a>
    <a href="soal.html"      class="nav-item"><span class="ni"><i class="fas fa-question-circle"></i></span> Manajemen Soal</a>
    <a href="siswa.html"     class="nav-item"><span class="ni"><i class="fas fa-users"></i></span> Manajemen Siswa</a>
    <a href="mapel.html"     class="nav-item"><span class="ni"><i class="fas fa-book"></i></span> Mata Pelajaran</a>
    <a href="hasil.html"     class="nav-item active"><span class="ni"><i class="fas fa-chart-bar"></i></span> Hasil Ujian</a>
    <div class="sidebar-bottom">
      <div class="nav-item" onclick="logout()" style="border-radius:8px;color:rgba(248,113,113,0.8);"><span class="ni"><i class="fas fa-sign-out-alt"></i></span> Keluar</div>
    </div>
  </aside>

  <main class="main-content">
    <div class="topbar">
      <div><h1>Hasil Ujian</h1><div style="font-size:0.8rem;color:var(--text-muted);"><i class="fas fa-chart-bar"></i> Admin / Hasil Ujian</div></div>
      <button class="btn btn-success" onclick="exportExcel()"><i class="fas fa-file-excel"></i> Export Excel</button>
    </div>

    <!-- Stats ringkas -->
    <div class="stats-grid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;">
      <div class="card" style="padding:16px;text-align:center;"><div style="font-size:2rem;font-weight:800;color:var(--primary)" id="st-total">0</div><div style="font-size:0.82rem;color:var(--text-muted)">Total Ujian</div></div>
      <div class="card" style="padding:16px;text-align:center;"><div style="font-size:2rem;font-weight:800;color:var(--success)" id="st-lulus">0</div><div style="font-size:0.82rem;color:var(--text-muted)">Lulus (&ge;75)</div></div>
      <div class="card" style="padding:16px;text-align:center;"><div style="font-size:2rem;font-weight:800;color:var(--danger)" id="st-tidak">0</div><div style="font-size:0.82rem;color:var(--text-muted)">Tidak Lulus</div></div>
      <div class="card" style="padding:16px;text-align:center;"><div style="font-size:2rem;font-weight:800;color:var(--warning)" id="st-avg2">0</div><div style="font-size:0.82rem;color:var(--text-muted)">Rata-rata Nilai</div></div>
    </div>

    <!-- Filter -->
    <div class="card" style="margin-bottom:20px;padding:16px;">
      <div class="filter-bar">
        <div class="form-group"><label class="form-label">Cari Nama / NIS</label>
          <input type="text" class="form-control" id="f-search" placeholder="Nama siswa..." oninput="renderTable()"></div>
        <div class="form-group"><label class="form-label">Kelas</label>
          <select class="form-control" id="f-kelas" onchange="renderTable()"><option value="">Semua Kelas</option></select></div>
        <div class="form-group"><label class="form-label">Mapel</label>
          <select class="form-control" id="f-mapel" onchange="renderTable()"><option value="">Semua Mapel</option></select></div>
        <div class="form-group"><label class="form-label">Status Nilai</label>
          <select class="form-control" id="f-status" onchange="renderTable()">
            <option value="">Semua</option>
            <option value="lulus">Lulus</option>
            <option value="tidak">Tidak Lulus</option>
          </select></div>
      </div>
    </div>

    <!-- Table -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">Data Hasil Ujian (<span id="count-hasil">0</span>)</div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>#</th><th>Nama</th><th>Kelas</th><th>Mapel</th><th>Benar</th><th>Salah</th><th>Nilai</th><th>Status</th><th>Waktu</th></tr></thead>
          <tbody id="hasil-tbody"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/utils.js"></script>
<script>
  if (!Utils.getLocal(CONFIG.STORAGE_KEYS.ADMIN_TOKEN)) window.location.href = 'login.html';

  let allHasil = [];

  async function loadHasil() {
    Utils.showLoading(true, 'Memuat hasil ujian...');
    try {
      const res = await API.getHasil({});
      Utils.showLoading(false);
      allHasil = res.data || [];

      // Isi filter
      const kelas = [...new Set(allHasil.map(h=>h.Kelas).filter(Boolean))].sort();
      const mapel = [...new Set(allHasil.map(h=>h.Mapel||h.KodeMapel).filter(Boolean))].sort();
      const selK  = document.getElementById('f-kelas');
      const selM  = document.getElementById('f-mapel');
      selK.innerHTML = '<option value="">Semua Kelas</option>' + kelas.map(k=>`<option>${k}</option>`).join('');
      selM.innerHTML = '<option value="">Semua Mapel</option>' + mapel.map(m=>`<option>${m}</option>`).join('');

      renderTable();
    } catch(e) {
      Utils.showLoading(false);
      Utils.toast('Gagal memuat hasil: ' + e.message, 'error');
    }
  }

  function renderTable() {
    const q      = document.getElementById('f-search').value.toLowerCase();
    const kelas  = document.getElementById('f-kelas').value;
    const mapel  = document.getElementById('f-mapel').value;
    const status = document.getElementById('f-status').value;

    let data = allHasil.filter(h => {
      const matchQ = !q     || (h.Nama||'').toLowerCase().includes(q) || (h.NIS||'').toString().includes(q);
      const matchK = !kelas || h.Kelas === kelas;
      const matchM = !mapel || (h.Mapel||h.KodeMapel) === mapel;
      const nilai  = Number(h.Nilai);
      const matchS = !status || (status==='lulus' ? nilai>=75 : nilai<75);
      return matchQ && matchK && matchM && matchS;
    });

    // Hitung stats
    document.getElementById('st-total').textContent = data.length;
    document.getElementById('st-lulus').textContent = data.filter(h=>Number(h.Nilai)>=75).length;
    document.getElementById('st-tidak').textContent = data.filter(h=>Number(h.Nilai)<75).length;
    const avg = data.length ? (data.reduce((s,h)=>s+Number(h.Nilai),0)/data.length).toFixed(1) : 0;
    document.getElementById('st-avg2').textContent  = avg;
    document.getElementById('count-hasil').textContent = data.length;

    const tbody = document.getElementById('hasil-tbody');
    if (!data.length) {
      tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:40px;color:var(--text-muted);">📭 Tidak ada data hasil ujian</td></tr>';
      return;
    }

    tbody.innerHTML = data.map((h, i) => {
      const nilai  = Number(h.Nilai);
      const lulus  = nilai >= 75;
      return `<tr>
        <td style="color:var(--text-muted);font-size:0.8rem">${i+1}</td>
        <td><strong>${Utils.escapeHtml(h.Nama)}</strong><br><span style="font-size:0.75rem;color:var(--text-muted)">${h.NIS}</span></td>
        <td>${h.Kelas}</td>
        <td style="font-size:0.85rem">${h.Mapel||h.KodeMapel}</td>
        <td style="color:var(--success);font-weight:600">${h.TotalBenar}</td>
        <td style="color:var(--danger);font-weight:600">${h.TotalSalah}</td>
        <td><span style="font-size:1.1rem;font-weight:800;color:${Utils.nilaiColor(nilai)}">${nilai}</span></td>
        <td><span class="badge ${lulus?'badge-success':'badge-danger'}">${lulus?'Lulus':'Tidak Lulus'}</span></td>
        <td style="font-size:0.78rem;color:var(--text-muted)">${Utils.formatDate(h.Timestamp)}</td>
      </tr>`;
    }).join('');
  }

  function exportExcel() {
    const q     = document.getElementById('f-search').value.toLowerCase();
    const kelas = document.getElementById('f-kelas').value;
    const mapel = document.getElementById('f-mapel').value;
    let data    = allHasil.filter(h => {
      const matchQ = !q || (h.Nama||'').toLowerCase().includes(q) || (h.NIS||'').toString().includes(q);
      const matchK = !kelas || h.Kelas === kelas;
      const matchM = !mapel || (h.Mapel||h.KodeMapel) === mapel;
      return matchQ && matchK && matchM;
    });
    const exportData = data.map((h,i) => ({
      No: i+1,
      NIS: h.NIS,
      Nama: h.Nama,
      Kelas: h.Kelas,
      Mapel: h.Mapel||h.KodeMapel,
      Benar: h.TotalBenar,
      Salah: h.TotalSalah,
      Nilai: h.Nilai,
      Status: Number(h.Nilai)>=75 ? 'Lulus' : 'Tidak Lulus',
      Waktu: Utils.formatDate(h.Timestamp)
    }));
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.json_to_sheet(exportData);
    XLSX.utils.book_append_sheet(wb, ws, 'Hasil Ujian');
    XLSX.writeFile(wb, 'hasil_ujian.xlsx');
    Utils.toast('Export berhasil', 'success');
  }

  function logout() {
    Utils.removeLocal(CONFIG.STORAGE_KEYS.ADMIN_TOKEN);
    Utils.removeLocal(CONFIG.STORAGE_KEYS.ADMIN_USER);
    window.location.href = 'login.html';
  }

  loadHasil();
</script>
</body>
</html>
