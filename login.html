<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Ujian Online</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0F172A 0%, #1E3A5F 50%, #1D4ED8 100%);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      position: relative; overflow: hidden;
    }
    .bg-circles span {
      position: absolute; border-radius: 50%;
      background: rgba(255,255,255,0.04);
    }
    .bg-circles span:nth-child(1) { width:600px;height:600px;top:-200px;right:-200px; }
    .bg-circles span:nth-child(2) { width:400px;height:400px;bottom:-150px;left:-150px; }
    .bg-circles span:nth-child(3) { width:200px;height:200px;top:30%;left:10%; }

    .login-card {
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.4);
      width: 100%; max-width: 420px;
      position: relative; z-index: 1;
      overflow: hidden;
      animation: slideUp 0.4s ease;
    }
    .login-banner {
      background: linear-gradient(135deg, #1E293B, #2563EB);
      padding: 32px 36px;
      text-align: center;
    }
    .login-banner .icon-wrap {
      width: 72px; height: 72px;
      background: rgba(255,255,255,0.15);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 14px;
      font-size: 2rem;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .login-banner h2 { color: #fff; margin-bottom: 4px; }
    .login-banner p  { color: rgba(255,255,255,0.7); font-size: 0.85rem; }

    .login-body { padding: 32px 36px 28px; }

    .input-group {
      position: relative;
    }
    .input-group .form-control {
      padding-left: 44px;
    }
    .input-icon {
      position: absolute; left: 14px; top: 50%;
      transform: translateY(-50%);
      color: #94A3B8; font-size: 0.95rem; pointer-events: none;
    }
    .toggle-pass {
      position: absolute; right: 12px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none; color: #94A3B8;
      cursor: pointer; font-size: 0.9rem; padding: 4px;
    }

    .error-box {
      background: #FEF2F2; border: 1px solid #FECACA;
      border-radius: 10px; padding: 12px 16px;
      color: #991B1B; font-size: 0.85rem;
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 16px; display: none;
    }

    .login-footer {
      padding: 0 36px 24px;
      text-align: center;
    }
    .login-footer a { color: #2563EB; font-size: 0.85rem; }

    @keyframes slideUp { from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1} }
    @media(max-width:480px){
      .login-banner, .login-body, .login-footer { padding-left:20px; padding-right:20px; }
    }
  </style>
</head>
<body>
  <div class="bg-circles">
    <span></span><span></span><span></span>
  </div>

  <div class="login-card">
    <!-- Banner -->
    <div class="login-banner">
      <div class="icon-wrap">
        <i class="fas fa-user-shield"></i>
      </div>
      <h2>Admin Panel</h2>
      <p>Sistem Manajemen Ujian Online</p>
    </div>

    <!-- Form -->
    <div class="login-body">
      <div class="error-box" id="error-box">
        <i class="fas fa-exclamation-circle"></i>
        <span id="error-msg">Username atau password salah.</span>
      </div>

      <div class="form-group">
        <label class="form-label">Username</label>
        <div class="input-group">
          <span class="input-icon"><i class="fas fa-user"></i></span>
          <input type="text" class="form-control" id="inp-username"
            placeholder="Masukkan username" autocomplete="username"
            onkeydown="if(event.key==='Enter')document.getElementById('inp-password').focus()">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-group">
          <span class="input-icon"><i class="fas fa-lock"></i></span>
          <input type="password" class="form-control" id="inp-password"
            placeholder="Masukkan password" autocomplete="current-password"
            onkeydown="if(event.key==='Enter')doLogin()">
          <button class="toggle-pass" type="button" onclick="togglePass(this)" tabindex="-1">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
        <label style="display:flex;align-items:center;gap:8px;font-size:0.85rem;cursor:pointer;">
          <input type="checkbox" id="remember-me" style="accent-color:#2563EB;">
          Ingat saya
        </label>
        <span style="font-size:0.8rem;color:#94A3B8;">Default: admin / admin123</span>
      </div>

      <button class="btn btn-primary btn-full btn-lg" id="btn-login" onclick="doLogin()">
        <i class="fas fa-sign-in-alt"></i> Masuk
      </button>
    </div>

    <div class="login-footer">
      <a href="../index.html"><i class="fas fa-arrow-left"></i> Kembali ke Halaman Siswa</a>
    </div>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script>
    // Cek jika sudah login
    window.addEventListener('DOMContentLoaded', () => {
      const token = Utils.getLocal(CONFIG.STORAGE_KEYS.ADMIN_TOKEN);
      if (token) window.location.href = 'dashboard.html';

      // Isi username tersimpan
      const savedUser = localStorage.getItem('admin_remember');
      if (savedUser) {
        document.getElementById('inp-username').value = savedUser;
        document.getElementById('remember-me').checked = true;
      }
    });

    function togglePass(btn) {
      const inp = document.getElementById('inp-password');
      if (inp.type === 'password') {
        inp.type = 'text';
        btn.innerHTML = '<i class="fas fa-eye-slash"></i>';
      } else {
        inp.type = 'password';
        btn.innerHTML = '<i class="fas fa-eye"></i>';
      }
    }

    async function doLogin() {
      const username = document.getElementById('inp-username').value.trim();
      const password = document.getElementById('inp-password').value;
      const errorBox = document.getElementById('error-box');
      const btn      = document.getElementById('btn-login');

      if (!username || !password) {
        showError('Username dan password wajib diisi.');
        return;
      }

      errorBox.style.display = 'none';
      btn.disabled   = true;
      btn.innerHTML  = '<i class="fas fa-spinner fa-spin"></i> Memverifikasi...';

      try {
        const res = await API.adminLogin(username, password);

        if (res.status !== 'success') {
          showError(res.message || 'Login gagal.');
          btn.disabled  = false;
          btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Masuk';
          return;
        }

        // Simpan sesi admin
        Utils.saveLocal(CONFIG.STORAGE_KEYS.ADMIN_TOKEN, res.data.adminToken);
        Utils.saveLocal(CONFIG.STORAGE_KEYS.ADMIN_USER, {
          username : res.data.username,
          role     : res.data.role,
          nama     : res.data.nama
        });

        // Remember me
        if (document.getElementById('remember-me').checked) {
          localStorage.setItem('admin_remember', username);
        } else {
          localStorage.removeItem('admin_remember');
        }

        Utils.toast('Login berhasil! Mengalihkan...', 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 800);

      } catch (err) {
        showError('Gagal menghubungi server: ' + err.message);
        btn.disabled  = false;
        btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Masuk';
      }
    }

    function showError(msg) {
      const box = document.getElementById('error-box');
      document.getElementById('error-msg').textContent = msg;
      box.style.display = 'flex';
    }
  </script>
</body>
</html>
